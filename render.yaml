services:
  - type: web
    name: aura-url-shortener
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000
      - key: DB_TYPE
        value: sqlite
      - key: BASE_URL
        value: https://url-shortner-yvf6.onrender.com
      - key: REDIRECT_STATUS
        value: 302
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
